<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d141b">
<title>Camp Radar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp Radar">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--chrome:#0d141b;--chrome2:#16212c;--text:#eef3f7;--muted:#9fb0bf;--line:#2a3846;--accent:#2f7dd1;--accent2:#7cc4ff}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--chrome2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;cursor:pointer}
button:active{filter:brightness(1.3)}

/* ---- weather banner ---- */
#banner{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line)}
#now{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0}
#nowTemp{font-size:64px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px}
#nowCond{font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowWind{font-size:17px;color:var(--text)}
#nowPlace{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowDetail{min-width:0}
#days{display:flex;gap:8px}
.day{width:104px;background:var(--chrome2);border-radius:12px;padding:6px 6px 5px;text-align:center;cursor:pointer;border:1px solid transparent}
.day:active{border-color:var(--accent2)}
.day .nm{font-size:14px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.day svg{width:44px;height:44px;display:block;margin:1px auto}
.day .t{font-size:18px;font-variant-numeric:tabular-nums}.day .t b{font-weight:750}.day .t span{color:var(--muted)}
.day .p{font-size:13px;color:var(--accent2);min-height:16px}
@media (max-width:860px){#banner{flex-wrap:wrap}#days{width:100%}.day{flex:1;width:auto}}

/* ---- warning + status bars ---- */
#warnbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#b71c1c;font-size:20px;font-weight:800}
#warnbar.flash{animation:flash 1s steps(2,jump-none) infinite}
#warnbar.minor{background:#7a6000;font-size:16px;font-weight:650}
@keyframes flash{50%{background:#ff1744}}
#warnText{flex:1;min-width:0}
#warnbar button{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.35);font-size:16px}
#statusbar{display:flex;align-items:center;gap:12px;padding:6px 14px;min-height:60px;background:#4a5560;transition:background .5s}
#statusbar.green{background:#1e7a45}#statusbar.blue{background:#245d94}#statusbar.yellow{background:#d4ad00;color:#1a1400}
#statusbar.orange{background:#d35f00}#statusbar.red{background:#c62828}#statusbar.grey{background:#4a5560}
#statusText{flex:1;min-width:0}
#statusMain{font-size:22px;font-weight:750;line-height:1.15}
#statusSub{font-size:15px;opacity:.92;margin-top:2px}
#rings{display:flex;gap:6px}
.ring{font-size:13px;font-weight:750;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.18);opacity:.5;white-space:nowrap}
.ring.on{opacity:1;background:rgba(0,0,0,.42)}
.ring.on::before{content:"\25CF";margin-right:4px;color:var(--accent2)}
#snoozeBtn{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.3);white-space:nowrap}
#snoozeMenu{position:fixed;right:12px;z-index:1500;background:var(--chrome2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#snoozeMenu .hdr{font-size:13px;color:var(--muted);padding:0 4px}
#snoozeMenu .opts{display:flex;gap:8px}
#snoozeMenu button{min-width:64px;font-weight:700}
@media (max-width:860px){#rings{display:none}}

/* ---- map ---- */
#mapwrap{position:relative;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;background:#dfe5ea}
body.night #map{background:#0b0f13}
/* night: darken only the basemap (radar sits in its own pane and keeps its colours) */
body.night .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
#controls{position:absolute;right:12px;top:12px;z-index:800;display:flex;flex-direction:column;gap:8px}
#controls button{width:62px;height:56px;padding:0;font-weight:800;font-size:19px;background:rgba(13,20,27,.88);color:#fff;border-color:rgba(255,255,255,.18);line-height:1}
#controls button small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
#controls button.on{background:var(--accent);border-color:var(--accent2)}
#controls svg{width:26px;height:26px;vertical-align:middle}
#controls .gap{height:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 10px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;min-height:44px;padding:0 12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent2)}
.tabpane[hidden]{display:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1b2733}
.toggle .tl{font-size:16px}.toggle .td{font-size:13px;color:var(--muted);margin-top:2px}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:#3a4854;border:0;min-height:0;padding:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:25px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--chrome2);color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.leaflet-popup-content{font-size:14px;line-height:1.4;margin:10px 14px}.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content a{color:var(--accent2)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);font-size:22px;padding:6px 8px 0 0}
.gauge{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.gauge.g0{background:#3b8f5a}.gauge.g1{background:#d4ad00}.gauge.g2{background:#ff8f00}.gauge.g3{background:#e53935}.gauge.g4{background:#8e24aa}.gauge.gx{background:#6c7a86;border-color:#cfd6dc}
.windarrow{color:#e8eef3;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;text-align:center;width:44px;margin-left:-22px;margin-top:-22px}
.windarrow svg{display:block;margin:0 auto;filter:drop-shadow(0 0 2px #000)}
#legend{position:absolute;right:12px;bottom:26px;z-index:800;background:rgba(13,20,27,.86);padding:6px 10px;border-radius:10px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-width:180px}
#legend span{display:flex;align-items:center;gap:6px}#legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
@media (max-width:860px){#legend{display:none}}
#zoomCtl{position:absolute;right:82px;top:12px;z-index:800;display:flex;flex-direction:column;gap:8px}
#zoomCtl button{width:62px;height:56px;padding:0;font-weight:700;font-size:30px;line-height:1;background:rgba(13,20,27,.88);color:#fff;border-color:rgba(255,255,255,.18)}
#frameInfo{position:absolute;left:12px;bottom:26px;z-index:800;background:rgba(13,20,27,.86);padding:7px 11px;border-radius:10px;font-size:15px;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:#56636f}.dots i.on{background:var(--accent2)}
#updated{position:absolute;left:12px;top:12px;z-index:800;background:rgba(13,20,27,.8);padding:5px 9px;border-radius:8px;font-size:13px;color:var(--muted)}
#pickHint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:850;background:var(--accent);padding:6px 8px 6px 16px;border-radius:12px;font-size:17px;font-weight:750;display:flex;gap:12px;align-items:center;white-space:nowrap}
#pickHint button{background:rgba(0,0,0,.25);min-height:40px}
#soundChip{position:absolute;left:12px;bottom:74px;z-index:850;background:#6a2fb0;border-color:#b48cff;font-weight:700}
#voiceChip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:900;background:#c62828;color:#fff;padding:10px 18px;border-radius:999px;font-size:18px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(198,40,40,.25)}}
#micBtn{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.3);padding:0 12px}
#micBtn.on{background:#c62828;border-color:#ff8a80}
.me{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 0 10px rgba(47,125,209,.25)}
.ringlbl{font-size:12px;font-weight:800;color:#17324b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block}
body.night .ringlbl{color:#e8eef3;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-control-attribution{font-size:10px!important}
body.night .leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#aaa}
body.night .leaflet-control-attribution a{color:#8ab}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:center;justify-content:center}
.sheet{background:var(--chrome2);border:1px solid var(--line);border-radius:16px;width:min(700px,94vw);max-height:88vh;overflow:auto;padding:14px 18px 18px;user-select:text}
.sheet h2{margin:4px 0 6px;font-size:22px}
.sheet{position:relative}
.sheetwrap{position:relative;width:min(700px,94vw)}
.sheetwrap .sheet{width:100%;box-sizing:border-box}
#sheetClose{position:absolute;top:8px;right:8px;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;font-size:22px;line-height:1;z-index:2;background:var(--chrome2)}
.sheet h2,.dayhead{padding-right:48px}
.row{margin:14px 0}
.row>label{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{background:var(--accent);border-color:var(--accent2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.diag{font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:14px;font-variant-numeric:tabular-nums}
.alert{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.alert h3{margin:4px 0;font-size:19px}
/* ---- day view ---- */
.dayhead{display:flex;align-items:center;gap:14px;margin:2px 0 8px}
.dayhead svg{width:56px;height:56px;flex:none}
.dayhead .hl{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead .hl b{font-weight:700}
.dayhead .sum{font-size:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.tile{background:#0b1117;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .n{font-size:13px;color:var(--muted);margin-top:2px}
.tile.warn{border-color:#d35f00;background:rgba(211,95,0,.12)}
.tile.bad{border-color:#c62828;background:rgba(198,40,40,.14)}
.tile.good{border-color:#1e7a45;background:rgba(30,122,69,.12)}
.hrs{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:6px}
.hrs th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--chrome2)}
.hrs td{padding:5px 6px;border-bottom:1px solid #1b2733;white-space:nowrap}
.hrs tr.now td{background:rgba(47,125,209,.18)}
.hrs tr.dark td{color:var(--muted)}
.hrs .w{color:#d4ad00;font-weight:700}.hrs .b{color:#ff6d5a;font-weight:700}
.hrs .bar{display:inline-block;height:8px;background:var(--accent);border-radius:4px;vertical-align:middle;margin-right:4px;opacity:.8}
.fctext{font-size:15px;line-height:1.45;margin:8px 0}
.fctext b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-top:8px}
.sunline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin:6px 0 2px}
.sunline b{color:var(--text);font-weight:600}
.alert .hl{font-weight:650}
.alert p{white-space:pre-wrap;font-size:15px;line-height:1.4;margin:6px 0}
.done{margin-top:12px;width:100%;background:var(--accent);border-color:var(--accent2);font-weight:750}

/* ---- tablets in landscape (8–11 in): two columns of map buttons so they fit above the bottom edge ---- */
@media (min-width:861px) and (max-height:900px){
  #controls{display:grid;grid-template-columns:62px 62px;gap:8px;top:12px;right:12px}
  #controls .gap{display:none}
  #controls button{height:52px}
  #zoomCtl{right:152px}
  #legend{right:152px}
}

/* ---- phones: portrait (narrow) and landscape (short) ---- */
@media (max-width:600px),(max-height:520px){
  body{padding-top:env(safe-area-inset-top)}
  #nowTemp{font-size:46px;letter-spacing:-1px}
  #nowCond{font-size:17px}#nowWind{font-size:15px}#nowPlace{font-size:13px}
  .day{padding:4px 4px 3px;border-radius:10px}
  .day .nm{font-size:12px}.day svg{width:32px;height:32px}.day .t{font-size:15px}.day .p{font-size:11.5px;min-height:14px}
  #statusbar{min-height:50px;padding:5px 10px;gap:8px}
  #statusMain{font-size:17px}#statusSub{font-size:13px}
  #snoozeBtn{min-height:40px;padding:0 10px;font-size:14px}
  #warnbar{flex-wrap:wrap;font-size:16px;padding:6px 10px;gap:8px}
  #warnbar button{min-height:38px;font-size:14px}
  /* map controls become a toolbar along the bottom */
  .leaflet-control-attribution{white-space:nowrap}
  #controls{top:auto;bottom:calc(22px + env(safe-area-inset-bottom));left:8px;right:8px;flex-direction:row;gap:5px}
  #controls .gap{display:none}
  #controls button{flex:1;width:auto;min-width:0;height:50px;font-size:16px}
  #controls button small{font-size:10px}
  #controls svg{width:22px;height:22px}
  #zoomCtl{right:8px;top:8px;gap:6px}
  #zoomCtl button{width:48px;height:46px;font-size:26px}
  #updated{top:8px;left:8px;font-size:12px;padding:4px 7px}
  #frameInfo{left:8px;bottom:calc(80px + env(safe-area-inset-bottom));font-size:13px;padding:5px 9px}
  #soundChip{left:8px;bottom:calc(120px + env(safe-area-inset-bottom));min-height:40px;font-size:14px}
  #pickHint{top:auto;bottom:calc(122px + env(safe-area-inset-bottom));white-space:normal;max-width:calc(100% - 24px);font-size:15px;padding:6px 6px 6px 12px}
  .sheetwrap{width:100%}
  .sheet{width:100%;max-height:92vh;border-radius:16px 16px 0 0;padding:12px 14px 18px}
  #modal{align-items:flex-end}
  #snoozeMenu .opts button{min-width:56px}
}
/* phone held sideways: keep the banner on one short row */
@media (max-height:520px) and (orientation:landscape){
  #banner{flex-wrap:nowrap;padding:4px 10px}
  #days{width:auto}.day{flex:none;width:84px}
  #nowTemp{font-size:38px}#nowPlace{display:none}
  .day svg{width:26px;height:26px}
  #statusbar{min-height:44px}
}

/* ---- dim / night ---- */
body.night{--chrome:#06090c;--chrome2:#0e151c}
body.night #banner,body.night #statusbar,body.night #warnbar,body.night #controls,body.night #frameInfo{filter:brightness(.8)}
</style>
</head>
<body>

<header id="banner">
  <div id="now">
    <div id="nowTemp">--°</div>
    <div id="nowDetail">
      <div id="nowCond">Loading weather…</div>
      <div id="nowWind"></div>
      <div id="nowPlace"></div>
    </div>
  </div>
  <div id="days"></div>
</header>

<div id="warnbar" hidden>
  <div id="warnText"></div>
  <button id="warnDetails">Details</button>
  <button id="warnAck">Acknowledge</button>
</div>

<div id="statusbar" class="grey">
  <div id="statusText">
    <div id="statusMain">Starting up…</div>
    <div id="statusSub"></div>
  </div>
  <div id="rings">
    <span class="ring" data-r="10">10 mi</span><span class="ring" data-r="30">30 mi</span><span class="ring" data-r="50">50 mi</span>
  </div>
  <button id="micBtn" title="Tap to talk" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></button>
  <button id="snoozeBtn">Snooze</button>
</div>

<main id="mapwrap">
  <div id="map"></div>
  <div id="controls">
    <button data-range="10">10<small>mi</small></button>
    <button data-range="30">30<small>mi</small></button>
    <button data-range="50">50<small>mi</small></button>
    <div class="gap"></div>
    <button id="btnCenter" title="Re-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button id="btnPlay" title="Play/pause radar loop"></button>
    <button id="btnBrief" title="Spoken briefing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button id="btnLayers" title="Map layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8.5 12 14l10-5.5z"/><path d="m2 13 10 5.5L22 13"/><path d="m2 17.5 10 5.5 10-5.5"/></svg></button>
    <button id="btnSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div id="zoomCtl">
    <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
  </div>
  <div id="updated"></div>
  <div id="frameInfo"></div>
  <div id="legend" hidden></div>
  <div id="pickHint" hidden><span id="pickText">Tap the map to set your camp location</span><button id="pickCancel">Cancel</button></div>
  <button id="soundChip" hidden>Tap to enable sound</button>

<script>
'use strict';
/* =====================================================================
   Camp Radar — standalone weather radar display for an Android tablet.
   Data: Iowa Environmental Mesonet NEXRAD composite (radar tiles),
         api.weather.gov (conditions, forecast, warnings),
         CARTO / OpenStreetMap (basemap). No API keys.
   ===================================================================== */

// ==NOWCAST-CORE-START==
/* Pure functions (no DOM) for reading radar pixels, tracking storm motion
   and predicting whether rain will reach a point. Unit-tested separately. */

/* Reflectivity colour scale used by BOTH NOAA MRMS (mapservices.weather.noaa.gov) and the
   IEM composite (same scale as radar.weather.gov): grey -> blue-grey -> blue -> cyan ->
   bright green (light rain, 20 dBZ) -> dark green -> olive -> yellow -> orange -> red.
   Stops measured from the live imagery; colours between stops are interpolated. */
const DBZ_RAMP = [
  [-10, 207, 209, 175], [0, 154, 160, 181], [10, 67, 94, 159], [15, 111, 214, 232],
  [20, 14, 214, 20], [30, 9, 94, 9], [30.5, 34, 107, 8], [40, 255, 226, 0],
  [45, 255, 177, 0], [50, 255, 0, 0], [60, 193, 0, 0], [65, 255, 0, 255], [70, 150, 80, 200], [75, 255, 255, 255]];

function colorToDbz(r, g, b, a) {
  if (a !== undefined && a < 40) return -99;
  let best = -99, bd = Infinity;
  for (let i = 0; i < DBZ_RAMP.length - 1; i++) {     // nearest point on the colour polyline
    const [d0, r0, g0, b0] = DBZ_RAMP[i], [d1, r1, g1, b1] = DBZ_RAMP[i + 1];
    const vr = r1 - r0, vg = g1 - g0, vb = b1 - b0, len = vr * vr + vg * vg + vb * vb;
    let t = len ? ((r - r0) * vr + (g - g0) * vg + (b - b0) * vb) / len : 0;
    t = Math.max(0, Math.min(1, t));
    const dist = (r - r0 - t * vr) ** 2 + (g - g0 - t * vg) ** 2 + (b - b0 - t * vb) ** 2;
    if (dist < bd) { bd = dist; best = d0 + t * (d1 - d0); }
  }
  return bd > 45 * 45 ? -99 : Math.round(best * 2) / 2;
}

// RGBA pixels -> grid of max dBZ per cell (cell = cellPx x cellPx pixels)
function gridFromRGBA(px, w, h, cellPx) {
  const gw = Math.floor(w / cellPx), gh = Math.floor(h / cellPx);
  const d = new Float32Array(gw * gh).fill(-99);
  const cache = new Map();
  for (let y = 0; y < gh * cellPx; y++) {
    const row = ((y / cellPx) | 0) * gw;
    for (let x = 0; x < gw * cellPx; x++) {
      const i = (y * w + x) * 4;
      if (px[i + 3] < 40) continue;
      const key = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2];
      let v = cache.get(key);
      if (v === undefined) { v = colorToDbz(px[i], px[i + 1], px[i + 2], 255); cache.set(key, v); }
      const gi = row + ((x / cellPx) | 0);
      if (v > d[gi]) d[gi] = v;
    }
  }
  return { w: gw, h: gh, d };
}

function downsampleMax(g, f) {
  const w = Math.floor(g.w / f), h = Math.floor(g.h / f);
  const d = new Float32Array(w * h).fill(-99);
  for (let y = 0; y < h * f; y++) for (let x = 0; x < w * f; x++) {
    const v = g.d[y * g.w + x], i = ((y / f) | 0) * w + ((x / f) | 0);
    if (v > d[i]) d[i] = v;
  }
  return { w, h, d };
}

// remove isolated single cells (radar speckle)
function despeckle(g, thresh) {
  const d = new Float32Array(g.d);
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
    const i = y * g.w + x;
    if (g.d[i] < thresh) continue;
    let n = 0;
    for (let dy = -1; dy <= 1 && !n; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= g.w || yy >= g.h) continue;
      if (g.d[yy * g.w + xx] >= thresh) { n++; break; }
    }
    if (!n) d[i] = -99;
  }
  return { w: g.w, h: g.h, d };
}

function intensityField(g) {
  const a = new Float32Array(g.d.length);
  for (let i = 0; i < a.length; i++) { const v = g.d[i]; a[i] = v >= 15 ? Math.min(v, 55) - 15 : 0; }
  return a;
}

function countRain(I, w, x0, y0, x1, y1) {
  let n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (I[y * w + x] > 0) n++;
  return n;
}

// Block matching: find shift (u,v) such that B(x,y) ~ A(x-u, y-v) within the box.
function bestShift(A, B, w, x0, y0, x1, y1, S) {
  const n = 2 * S + 1, errs = new Float64Array(n * n);
  let best = Infinity, bu = 0, bv = 0, sum = 0;
  for (let v = -S; v <= S; v++) for (let u = -S; u <= S; u++) {
    let e = 0;
    for (let y = y0; y <= y1; y++) {
      const rb = y * w, ra = (y - v) * w - u;
      for (let x = x0; x <= x1; x++) {
        const diff = B[rb + x] - A[ra + x];
        e += diff < 0 ? -diff : diff;
      }
    }
    errs[(v + S) * n + (u + S)] = e; sum += e;
    if (e < best || (e === best && Math.abs(u) + Math.abs(v) < Math.abs(bu) + Math.abs(bv))) { best = e; bu = u; bv = v; }
  }
  const mean = sum / (n * n);
  const conf = mean > 0 ? 1 - best / mean : 0;
  const edge = Math.abs(bu) === S || Math.abs(bv) === S;
  let du = 0, dv = 0;   // sub-cell refinement (parabola fit)
  if (!edge) {
    const at = (u, v) => errs[(v + S) * n + (u + S)];
    const em = at(bu - 1, bv), ep = at(bu + 1, bv), den = em - 2 * best + ep;
    if (den > 0) du = Math.max(-0.5, Math.min(0.5, (em - ep) / (2 * den)));
    const fm = at(bu, bv - 1), fp = at(bu, bv + 1), den2 = fm - 2 * best + fp;
    if (den2 > 0) dv = Math.max(-0.5, Math.min(0.5, (fm - fp) / (2 * den2)));
  }
  return { u: bu + du, v: bv + dv, conf, edge };
}

/* Storm motion between an older grid gA and newer grid gB, dtMin apart.
   Velocities are km/min, x = east, y = south (image orientation). */
function estimateMotion(gA, gB, dtMin, cellKm, opts) {
  opts = opts || {};
  const maxKmh = opts.maxKmh || 110, minCells = opts.minCells || 10, minConf = opts.minConf || 0.25;
  const w = gB.w, h = gB.h;
  const S = Math.max(2, Math.ceil((maxKmh / 60) * dtMin / cellKm));
  const out = { ok: false, regions: [], dtMin, S, global: { vx: 0, vy: 0, conf: 0 }, speedMph: 0, headingDeg: 0, regionSize: 1 };
  const x0 = S, y0 = S, x1 = w - 1 - S, y1 = h - 1 - S;
  if (x1 - x0 < 8 || y1 - y0 < 8) { out.reason = 'domain too small'; return out; }
  const A = intensityField(gA), B = intensityField(gB);
  const cA = countRain(A, w, x0, y0, x1, y1), cB = countRain(B, w, x0, y0, x1, y1);
  if (cA < minCells || cB < minCells) { out.reason = 'too little rain to track'; return out; }
  const toV = u => u * cellKm / dtMin;
  const g = bestShift(A, B, w, x0, y0, x1, y1, S);
  out.global = { vx: toV(g.u), vy: toV(g.v), conf: g.conf };
  const gSpeed = Math.hypot(out.global.vx, out.global.vy) * 60;
  out.ok = g.conf >= minConf && !g.edge && gSpeed <= maxKmh;
  if (!out.ok) out.reason = g.edge ? 'motion off scale' : 'no clear motion';
  const nx = 3, ny = 3, rw = (x1 - x0 + 1) / nx, rh = (y1 - y0 + 1) / ny;
  out.regionSize = Math.max(rw, rh);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const rx0 = x0 + Math.round(i * rw), rx1 = x0 + Math.round((i + 1) * rw) - 1;
    const ry0 = y0 + Math.round(j * rh), ry1 = y0 + Math.round((j + 1) * rh) - 1;
    const reg = { cx: (rx0 + rx1) / 2, cy: (ry0 + ry1) / 2, ok: false, vx: 0, vy: 0, conf: 0 };
    if (countRain(A, w, rx0, ry0, rx1, ry1) >= minCells && countRain(B, w, rx0, ry0, rx1, ry1) >= minCells) {
      const r = bestShift(A, B, w, rx0, ry0, rx1, ry1, S);
      reg.vx = toV(r.u); reg.vy = toV(r.v); reg.conf = r.conf;
      const sp = Math.hypot(reg.vx, reg.vy) * 60;
      const devKmh = Math.hypot(reg.vx - out.global.vx, reg.vy - out.global.vy) * 60;
      reg.ok = r.conf >= minConf && !r.edge && sp <= maxKmh && (!out.ok || devKmh <= 60);
    }
    out.regions.push(reg);
  }
  if (!out.ok && out.regions.some(r => r.ok)) {   // global failed but some regions are solid
    const rs = out.regions.filter(r => r.ok);
    out.global = { vx: rs.reduce((s, r) => s + r.vx, 0) / rs.length, vy: rs.reduce((s, r) => s + r.vy, 0) / rs.length, conf: minConf };
    out.ok = true; delete out.reason;
  }
  out.speedMph = Math.hypot(out.global.vx, out.global.vy) * 60 * 0.621371;
  out.headingDeg = (Math.atan2(out.global.vx, -out.global.vy) * 180 / Math.PI + 360) % 360;
  return out;
}

// Velocity at a fine-grid cell, blended from regional vectors (inverse distance)
function makeVelocityField(motion, fineToCoarse) {
  const zero = { vx: 0, vy: 0 };
  if (!motion || !motion.ok) return () => zero;
  const regs = motion.regions.filter(r => r.ok);
  const g = { vx: motion.global.vx, vy: motion.global.vy };
  if (!regs.length) return () => g;
  const s2 = motion.regionSize * motion.regionSize * 0.25;
  return (x, y) => {
    const X = x / fineToCoarse, Y = y / fineToCoarse;
    let sw = 0.1 / s2, vx = g.vx * sw, vy = g.vy * sw;     // small pull toward global
    for (const r of regs) {
      const dx = X - r.cx, dy = Y - r.cy, w = 1 / (dx * dx + dy * dy + s2);
      sw += w; vx += w * r.vx; vy += w * r.vy;
    }
    return { vx: vx / sw, vy: vy / sw };
  };
}

function bearingDeg(e, n) { return (Math.atan2(e, n) * 180 / Math.PI + 360) % 360; }

/* Project every rain cell forward along its motion and see if it passes over
   the user (cx, cy in fine-cell units). Returns arrival estimate + what's passing. */
function predictRain(grid, cellKm, cx, cy, vel, opts, labels) {
  const thresh = opts.thresh, horizon = opts.horizonMin || 120, maxRing = opts.maxRingMi || 50;
  const cellMi = cellKm * 0.621371, R = opts.hitRadiusMi + 0.7 * cellMi, R2 = R * R;
  const rings = { 10: false, 30: false, 50: false };
  let nearest = null, passing = null, hits = 0, eta = Infinity, end = 0, maxDbz = -99, from = null, hitBlob = null, nearestBlob = null;
  const hitBlobCells = new Map();
  for (let y = 0; y < grid.h; y++) for (let x = 0; x < grid.w; x++) {
    const d = grid.d[y * grid.w + x];
    if (d < thresh) continue;
    const e = (x + 0.5 - cx) * cellMi, n = -(y + 0.5 - cy) * cellMi;
    const dist = Math.hypot(e, n);
    if (dist <= maxRing) {
      if (dist <= 10) rings[10] = true;
      if (dist <= 30) rings[30] = true;
      rings[50] = true;
      if (!nearest || dist < nearest.distMi) { nearest = { distMi: dist, bearing: bearingDeg(e, n), dbz: d }; nearestBlob = labels ? labels[y * grid.w + x] : null; }
    }
    const v = vel(x, y), ve = v.vx * 0.621371, vn = -v.vy * 0.621371;   // mi/min
    const a = ve * ve + vn * vn;
    let tIn = null, tOut = null;
    if (dist * dist <= R2) {
      tIn = 0;
      if (a < 1e-9) tOut = horizon;
      else { const b = 2 * (e * ve + n * vn), c = dist * dist - R2; tOut = Math.min(horizon, (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a)); }
    } else if (a > 1e-9) {
      const b = 2 * (e * ve + n * vn), c = dist * dist - R2, disc = b * b - 4 * a * c;
      if (disc >= 0) {
        const sq = Math.sqrt(disc), t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
        if (t2 >= 0 && t1 <= horizon) { tIn = Math.max(0, t1); tOut = Math.min(horizon, t2); }
      }
    }
    if (tIn !== null) {
      hits++;
      if (tIn < eta) { eta = tIn; from = bearingDeg(e, n); hitBlob = labels ? labels[y * grid.w + x] : null; }
      if (labels) { const lb = labels[y * grid.w + x]; hitBlobCells.set(lb, (hitBlobCells.get(lb) || 0) + 1); }
      if (tOut > end) end = tOut;
      if (d > maxDbz) maxDbz = d;
    } else if (dist <= maxRing) {
      const t = a > 1e-9 ? Math.max(0, Math.min(horizon, -(e * ve + n * vn) / a)) : 0;
      const pe = e + ve * t, pn = n + vn * t;
      if (!passing || dist < passing.distMi)
        passing = { distMi: dist, bearing: bearingDeg(e, n), passBearing: bearingDeg(pe, pn), closestMi: Math.hypot(pe, pn) };
    }
  }
  const hit = hits >= (opts.minHitCells || 2) ? { etaMin: eta, endMin: end, maxDbz, fromBearing: from, cells: hits, blob: hitBlob, blobCells: hitBlobCells } : null;
  return { rings, nearest, passing, hit, nearestBlob };
}
/* ---- intensity trends: track each storm cell across frames ---- */
// Connected rain blobs (8-neighbour) above thresh; returns labels per cell and per-blob stats.
function labelBlobs(grid, thresh, minCells) {
  minCells = minCells || 3;
  const { w, h, d } = grid, labels = new Int32Array(w * h), blobs = [];
  const stack = [];
  for (let i = 0; i < d.length; i++) {
    if (d[i] < thresh || labels[i]) continue;
    const id = blobs.length + 1; let n = 0, peak = -99, vol = 0, sx = 0, sy = 0;
    labels[i] = id; stack.push(i);
    while (stack.length) {
      const k = stack.pop(), x = k % w, y = (k / w) | 0, v = d[k];
      n++; vol += v - thresh + 1; sx += x; sy += y; if (v > peak) peak = v;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const kk = yy * w + xx; if (d[kk] >= thresh && !labels[kk]) { labels[kk] = id; stack.push(kk); }
      }
    }
    blobs.push({ id, n, peak, vol, cx: sx / n, cy: sy / n });
  }
  // drop tiny blobs from the label map (they still count as rain for arrival, just not for trends)
  for (const b of blobs) if (b.n < minCells) b.tiny = true;
  return { labels, blobs };
}
// For each blob in the newest frame, find its earlier self: back-project the centroid by the motion and pick the nearest blob of comparable size.
function matchBlobs(newB, oldB, dtMin, vel, cellKm) {
  const out = new Map();
  for (const b of newB.blobs) {
    if (b.tiny) continue;
    const v = vel(Math.round(b.cx), Math.round(b.cy));
    const px = b.cx - v.vx * dtMin / cellKm, py = b.cy - v.vy * dtMin / cellKm;   // where it should have been
    const reach = Math.max(6, 1.5 * Math.sqrt(b.n / Math.PI));
    let best = null, bd = Infinity;
    for (const o of oldB.blobs) {
      if (o.tiny) continue;
      const dd = Math.hypot(o.cx - px, o.cy - py);
      if (dd < reach + Math.sqrt(o.n / Math.PI) && dd < bd) { bd = dd; best = o; }
    }
    if (best) out.set(b.id, best);
  }
  return out;
}
/* Trend for every blob in the newest frame from up to two earlier frames.
   word: 'strengthening' | 'weakening' | 'steady' | 'new' ; fizzleMin = minutes until peak drops below thresh (weakening only). */
function blobTrends(frames, dts, vel, cellKm, thresh) {
  const newest = frames[frames.length - 1], trends = new Map();
  const matches = frames.slice(0, -1).map((f, i) => matchBlobs(newest, f, dts[i], vel, cellKm));
  for (const b of newest.blobs) {
    if (b.tiny) continue;
    const pts = [{ t: 0, vol: b.vol, peak: b.peak, n: b.n }];
    matches.forEach((m, i) => { const o = m.get(b.id); if (o) pts.push({ t: -dts[i], vol: o.vol, peak: o.peak, n: o.n }); });
    if (pts.length < 2) { trends.set(b.id, { word: 'new', pts: 1 }); continue; }
    const oldest = pts[pts.length - 1], span = -oldest.t;
    const volRatio = b.vol / Math.max(1, oldest.vol), peakDelta = b.peak - oldest.peak, areaRatio = b.n / Math.max(1, oldest.n);
    let word = 'steady';
    if ((volRatio >= 1.35 && areaRatio >= 1.1) || peakDelta >= 7) word = 'strengthening';
    else if ((volRatio <= 0.7 && areaRatio <= 0.9) || peakDelta <= -7) word = 'weakening';
    let fizzleMin = null;
    if (word === 'weakening') {
      const peakRate = peakDelta / span;                       // dBZ per minute (negative)
      const volRate = Math.log(Math.max(0.05, volRatio)) / span;   // exponential decay rate
      const tPeak = peakRate < -0.05 ? (thresh - b.peak) / peakRate : Infinity;
      const tVol = volRate < -0.005 ? Math.log(0.15) / volRate : Infinity;   // down to 15% of current volume
      fizzleMin = Math.min(tPeak, tVol);
      if (!isFinite(fizzleMin)) fizzleMin = null;
    }
    trends.set(b.id, { word, volRatio, areaRatio, peakDelta, spanMin: span, fizzleMin, pts: pts.length });
  }
  return trends;
}
// ==NOWCAST-CORE-END==

/* ----------------------------- config ------------------------------ */
const MI = 1609.344;
const IEM_TILES = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/';
const NWS = 'https://api.weather.gov';
const CRITICAL = ['Tornado Warning', 'Severe Thunderstorm Warning', 'Flash Flood Warning', 'Flood Warning'];
const CRIT_COLOR = { 'Tornado Warning': '#ff1744', 'Severe Thunderstorm Warning': '#ffa000', 'Flash Flood Warning': '#00c853', 'Flood Warning': '#2e7d32' };
const FRAMES = [50, 40, 30, 20, 10, 0];                 // minutes ago, radar loop
const NC = { zoom: 7, radiusMi: 120, fineCellPx: 2, coarse: 2, horizonMin: 120, latencyMin: 4, maxKmh: 110 };
const KEY = 'campRadar.v1';
const DEFAULTS = { range: 30, hitMi: 3, threshDbz: 20, volume: 0.8, opacity: 0.7, animate: true, night: 'auto',
  locMode: 'gps', manual: null, lastLoc: null, snoozeUntil: 0, ack: {}, recent: [], source: 'mrms', backend: '', pushId: null, sound: true, activity: 'camping',
  layers: { flood: true, gauges: true, fire: true, firewx: true, smoke: false, wind: false, clouds: false, rx: false },

const S = Object.assign({}, DEFAULTS, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
S.layers = Object.assign({}, DEFAULTS.layers, S.layers || {});

const $ = s => document.querySelector(s);
const st = {
  loc: null, gpsAcc: null, gpsErr: null, picking: false,
  wx: { points: null, key: null, stationId: null, stationName: null, pop2h: null, isDay: null, hourly0: null, obsAt: 0, fcAt: 0, err: null,
        daily: [], hourly: [], grid: null, pressure: null },
  nc: null, ncAt: 0, ncErr: null, ncBusy: false,
  alerts: [], alertsAt: 0, alertsErr: null,
  evt: { active: false, imminentDone: false, clear: 0 },
  lastTouch: 0,
  lightning: null, lightningAt: 0, lightningErr: null, ltEvt: { active: false, sentMs: 0 },
  backendOk: null,
  hz: { gauges: [], fires: [], floodAlerts: [], firewx: [], at: 0, err: null, nearest: {} }, hzEvt: {}, windAt: 0,
};
const BE = () => (S.backend || '').trim().replace(/\/+$/, '');

/* ----------------------------- helpers ----------------------------- */
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const DIRS_LONG = ['north','northeast','northeast','east','east','southeast','southeast','south','south','southwest','southwest','west','west','northwest','northwest','north'];
const compass = d => DIRS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const compassLong = d => DIRS_LONG[Math.floor(((d % 360) + 360) % 360 / 22.5) % 16];
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const cToF = c => c == null ? null : c * 9 / 5 + 32;
const kmhToMph = k => k == null ? null : k * 0.621371;
function distMi(a, b) {
  const R = 3958.8, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;

function lonLatToPx(lon, lat, z) {
  const n = 256 * 2 ** z, s = Math.sin(lat * Math.PI / 180);

async function radarComposite(f, center, R, z) {

    const res = 2 * MERC / (256 * 2 ** z);

    const mpp = 156543.03392 * Math.cos(st.loc.lat * Math.PI / 180) / 2 ** z;

    let fr;

      const T = st.radarTimes, latest = T[T.length - 1];

async function refreshHazards() {

  const b = map.getBounds(), bb = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => v.toFixed(3)).join(',');
  const tasks = [];

    m.bindPopup('<b>' + esc(g.location) + '</b><br>' + esc(g.waterbody || '') + '<br>Stage: <b>' + esc(stage) + '</b> · ' + esc((g.status || '').replace(/_/g, ' ')) + (thresholds ? '<br><small>' + esc(thresholds) + ' ' + esc(g.units || 'ft') + '</small>' : '') + (g.obstime ? '<br><small>' + esc(g.obstime) + ' UTC</small>' : '') + (g.url ? '<br><a href="' + esc(g.url) + '" target="_blank" rel="noopener">Hydrograph and forecast</a>' : ''));

}

// NWS alerts of the hazard kinds, nationwide (cached), drawn where polygons exist; zone-only alerts get their zone outlines, a few at a time
const zoneCache = new Map();
let hzAlertsCache = { at: 0, feats: [] };
async function loadHazardAlerts(b) {
  if (Date.now() - hzAlertsCache.at > 2 * 60000) {
    const events = ['Flood Warning', 'Flash Flood Warning', 'Flood Watch', 'Flash Flood Watch', 'Flood Advisory', 'Coastal Flood Warning', 'Red Flag Warning', 'Fire Weather Watch'].join(',');
    const j = await nws(NWS + '/alerts/active?event=' + encodeURIComponent(events));
    hzAlertsCache = { at: Date.now(), feats: j.features || [] };
  }
  floodLayer.clearLayers(); firewxLayer.clearLayers();
  const view = b.pad(0.5); let zoneFetches = 0;
  st.hz.floodAlerts = []; st.hz.firewx = [];
  for (const f of hzAlertsCache.feats) {
    const p = f.properties, isFire = /Red Flag|Fire Weather/.test(p.event);
    if (isFire ? !S.layers.firewx : !S.layers.flood) continue;
    let geom = f.geometry;
    if (!geom) {   // zone-based: fetch the first few zone outlines
      const zones = (p.affectedZones || []).slice(0, 3); const parts = [];
      for (const z of zones) {
        if (!zoneCache.has(z)) { if (zoneFetches >= 6) continue; zoneFetches++; try { const zj = await nws(z); zoneCache.set(z, zj.geometry || null); } catch (e) { zoneCache.set(z, null); } }
        const g = zoneCache.get(z); if (g) parts.push(g);
      }
      if (!parts.length) continue;
      geom = parts.length === 1 ? parts[0] : { type: 'GeometryCollection', geometries: parts };
    }
    const lyr = L.geoJSON(geom, { pane: 'hazards', interactive: true, style: isFire ? { color: '#ff8a65', weight: 1.5, fillColor: '#ff8a65', fillOpacity: 0.12, dashArray: '4 4' } : { color: /Warning/.test(p.event) ? '#1565c0' : '#42a5f5', weight: /Warning/.test(p.event) ? 2.5 : 1.5, fillColor: '#1e88e5', fillOpacity: /Warning/.test(p.event) ? 0.2 : 0.08 } });
    if (!lyr.getBounds().isValid() || !lyr.getBounds().intersects(view)) continue;
    lyr.bindPopup('<b>' + esc(p.event) + '</b><br>' + esc(p.headline || '') + (p.ends ? '<br><small>Until ' + clock(Date.parse(p.ends)) + ' ' + fmtDate(Date.parse(p.ends)) + '</small>' : ''));
    lyr.addTo(isFire ? firewxLayer : floodLayer);

    (isFire ? st.hz.firewx : st.hz.floodAlerts).push({ event: p.event, headline: p.headline, bounds: lyr.getBounds(), lat: c.lat, lon: c.lng, warning: /Warning/.test(p.event) });

}
function summarizeHazards() {
  const n = {}; if (!st.loc) { st.hz.nearest = n; return; }
  const here = { lat: st.loc.lat, lon: st.loc.lon }, pt = L.latLng(st.loc.lat, st.loc.lon);
  const fires = st.hz.fires.filter(f => f.type !== 'RX').map(f => ({ ...f, d: distMi(here, f) })).filter(f => f.d <= 50).sort((a, b) => a.d - b.d);
  if (fires.length) n.fire = fires[0];
  const g = st.hz.gauges.filter(x => x.rank >= 2).map(x => ({ ...x, d: distMi(here, x) })).filter(x => x.d <= 50).sort((a, b) => b.rank - a.rank || a.d - b.d);
  if (g.length) n.gauge = g[0];
  const fa = st.hz.floodAlerts.filter(a => a.bounds.contains(pt) || distMi(here, a) <= 25).sort((a, b) => (b.warning - a.warning));
  if (fa.length) n.floodAlert = fa[0];

function hazardLines() {
  const n = st.hz.nearest || {}, lines = [];
  if (n.fire) lines.push('🔥 ' + n.fire.name + ' fire ' + Math.max(1, Math.round(n.fire.d)) + ' mi ' + compass(bearingTo(st.loc, n.fire)) + (n.fire.acres ? ', ' + Math.round(n.fire.acres).toLocaleString() + ' ac' : '') + (n.fire.contained != null ? ', ' + Math.round(n.fire.contained) + '% contained' : ''));
  if (n.gauge) lines.push('🌊 River gauge at ' + n.gauge.location + ' reports ' + n.gauge.status + ' flooding, ' + Math.max(1, Math.round(n.gauge.d)) + ' mi ' + compass(bearingTo(st.loc, n.gauge)));
  else if (n.floodAlert) lines.push('🌊 ' + n.floodAlert.event + (n.floodAlert.bounds.contains(L.latLng(st.loc.lat, st.loc.lon)) ? ' in effect here' : ' nearby'));

function bearingTo(a, b) { const r = Math.PI / 180, dLon = (b.lon - a.lon) * r; const y = Math.sin(dLon) * Math.cos(b.lat * r), x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos(dLon); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }

// Wind arrows: a grid of points across the view from Open-Meteo (current conditions, mph)
async function refreshWind() {
  if (!S.layers.wind) { windLayer.clearLayers(); return; }
  const b = map.getBounds(), latSpan = b.getNorth() - b.getSouth(), lonSpan = b.getEast() - b.getWest();
  if (latSpan > 14 || lonSpan > 22) { windLayer.clearLayers(); st.windNote = 'zoom in for wind'; return; }
  const nx = 9, ny = 6, lats = [], lons = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { lats.push((b.getSouth() + latSpan * (j + 0.5) / ny).toFixed(3)); lons.push((b.getWest() + lonSpan * (i + 0.5) / nx).toFixed(3)); }
  try {
    const r = await fetchT('https://api.open-meteo.com/v1/forecast?latitude=' + lats.join(',') + '&longitude=' + lons.join(',') + '&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph&forecast_days=1', {}, 15000);
    const j = await r.json(); const arr = Array.isArray(j) ? j : [j];
    windLayer.clearLayers();
    arr.forEach((pt, k) => {
      const c = pt.current; if (!c) return;
      const sp = Math.round(c.wind_speed_10m), g = Math.round(c.wind_gusts_10m || 0), dir = c.wind_direction_10m;   // dir = where wind comes FROM
      const col = Math.max(sp, g) >= 30 ? '#ff6d5a' : Math.max(sp, g) >= 20 ? '#ffd23c' : '#9fd6ff';
      const html = '<div class="windarrow"><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(' + (dir + 180) + 'deg)"><path d="M12 2v18M6 14l6 6 6-6" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' + sp + (g > sp + 4 ? '<span style="color:' + col + '"> g' + g + '</span>' : '') + '</div>';
      L.marker([+lats[k], +lons[k]], { pane: 'hazards', interactive: false, icon: L.divIcon({ className: '', html, iconSize: [0, 0] }) }).addTo(windLayer);
    });
    st.windAt = Date.now(); st.windNote = null;
  } catch (e) { st.windNote = 'wind unavailable: ' + e.message; }
}

/* --------------------------- status + chime ------------------------ */
function computeStatus() {
  const out = { cls: 'grey', main: '', sub: '', level: 'none', rings: { 10: false, 30: false, 50: false } };
  if (!st.loc) { out.main = 'Waiting for location…'; return out; }
  const stale = !st.ncAt || Date.now() - st.ncAt > 15 * 60000;
  if (!st.nc && !st.ncErr) { out.main = 'Checking radar…'; return out; }
  if (stale) { out.main = 'Rain tracking unavailable'; out.sub = st.ncErr || 'Radar data is out of date — check the internet connection'; return overlayLightning(out); }
  const { res, motion } = st.nc, hit = res.hit, lat = radarLag();
  out.rings = res.rings;
  const moving = motion.ok && motion.speedMph >= 3 ? 'Storms moving ' + compass(motion.headingDeg) + ' at ' + Math.round(motion.speedMph) + ' mph'
    : motion.ok ? 'Rain nearly stationary' : '';
  const lowConf = hit && hit.etaMin > 15 && hit.maxDbz < 30 && st.wx.pop2h != null && st.wx.pop2h < 10;
  const tr = hit && hit.trend, trendWord = tr && tr.word === 'strengthening' ? ', strengthening' : tr && tr.word === 'weakening' ? ', weakening' : '';
  // A weakening storm that should be gone before it arrives is a watch, not an alarm — unless it's close or heavy.
  if (hit && hit.fizzles && !lowConf && hit.etaMin - lat > 10 && hit.maxDbz < 40) {
    out.cls = 'yellow'; out.level = 'low';
    out.main = 'Rain to the ' + compassLong(hit.fromBearing) + ' is weakening — may fizzle before it reaches you';
    out.sub = 'If it holds together: ' + intensityWord(hit.maxDbz).toLowerCase() + ' rain ≈ ' + clock(Date.now() + Math.max(0, hit.etaMin - lat) * 60000) + (moving ? ' · ' + moving : '');
    out.rings = res.rings; return overlayLightning(out);
  }
  if (hit && !lowConf) {
    const eta = Math.max(0, hit.etaMin - lat), word = intensityWord(hit.maxDbz) + trendWord;
    if (hit.etaMin <= 0.5) {
      out.cls = 'red'; out.level = 'atyou'; out.main = word + ' rain at your location';
      out.sub = hit.endMin < NC.horizonMin - 5 ? 'Likely ending ≈ ' + clock(Date.now() + Math.max(0, hit.endMin - lat) * 60000) : 'May continue for a while';
    } else if (eta <= 10) {
      out.cls = 'red'; out.level = 'imminent'; out.main = 'Rain arriving in ~' + Math.max(1, Math.round(eta)) + ' min';
      out.sub = word + ' rain from the ' + compassLong(hit.fromBearing) + (moving ? ' · ' + moving : '');
    } else {
      out.cls = 'orange'; out.level = 'incoming'; out.main = 'Rain arriving ≈ ' + clock(Date.now() + eta * 60000) + ' (in ' + fmtDur(eta) + ')';
      out.sub = word + ' rain from the ' + compassLong(hit.fromBearing) + (moving ? ' · ' + moving : '');
    }
  } else if (hit && lowConf) {
    out.cls = 'yellow'; out.level = 'low';
    out.main = 'Light rain may reach you ≈ ' + clock(Date.now() + Math.max(0, hit.etaMin - lat) * 60000);
    out.sub = 'Low confidence — NWS shows ' + st.wx.pop2h + '% chance in the next 2 hours';
  } else if (!motion.ok && res.nearest && res.nearest.distMi <= 10) {
    out.cls = 'orange'; out.level = 'incoming';
    out.main = 'Rain ' + Math.round(res.nearest.distMi) + ' mi ' + compass(res.nearest.bearing);
    out.sub = 'Movement unclear (' + (motion.reason || 'not enough data') + ') — keep an eye on it';
  } else if (res.passing) {
    const p = res.passing, nt = res.nearestTrend;
    out.cls = 'blue'; out.level = 'passing';
    out.main = 'Rain ' + Math.round(p.distMi) + ' mi ' + compass(p.bearing) + ' — ' + (motion.ok && motion.speedMph >= 3 ? 'passing to the ' + compassLong(p.passBearing) : 'not heading your way');
    out.sub = (motion.ok && motion.speedMph >= 3 ? 'Closest ≈ ' + Math.max(1, Math.round(p.closestMi)) + ' mi · ' : '') + (moving || 'Movement unclear') + (nt && nt.word === 'strengthening' ? ' · nearest storm strengthening' : nt && nt.word === 'weakening' ? ' · nearest storm weakening' : '');
  } else {
    out.cls = 'green'; out.main = 'No rain heading your way'; out.sub = res.nearest ? '' : 'Clear within 50 miles';
  }
  return overlayLightning(out);
}

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  if (!r.ok) throw new Error('Backend refused: ' + r.status);

const segRows = key => SETTINGS[key].map(([k, label, opts]) => '<div class="row"><label>' + label + '</label><div class="seg">' +
  opts.map(([v, t]) => '<button data-k="' + k + '" data-v="' + v + '" class="' + (S[k] === v ? 'on' : '') + '">' + t + '</button>').join('') + '</div></div>').join('');
const inputStyle = 'style="width:100%;box-sizing:border-box;min-height:46px;font:inherit;font-size:16px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#0b1117;color:var(--text)"';
function openSettings(tab) {
  if (tab) settingsTab = tab;
  const sh = $('#sheet');
  const pane = (id, html) => '<div class="tabpane" data-pane="' + id + '"' + (settingsTab === id ? '' : ' hidden') + '>' + html + '</div>';
  sh.innerHTML = '<h2>Settings</h2>' +
    '<div class="tabs">' + TABS.map(([id, name]) => '<button data-tab="' + id + '" class="' + (settingsTab === id ? 'on' : '') + '">' + name + '</button>').join('') + '</div>' +
    pane('general', '<div class="row"><label>Location</label><div class="btns"><button data-act="loc">' + (S.locMode === 'gps' ? 'Using GPS' : 'Set manually') + ' — change…</button></div></div>' + segRows('general') +
      '<div class="row"><label>Radar opacity</label><input type="range" min="0.3" max="1" step="0.05" data-slider="opacity" value="' + S.opacity + '"></div>') +
    pane('alerts', segRows('alerts') +
      '<div class="row"><label>Chime volume</label><input type="range" min="0" max="1" step="0.05" data-slider="volume" value="' + S.volume + '">' +
      '<div class="btns"><button data-act="rain">Test rain chime</button><button data-act="warn">Test warning alarm</button></div></div>' +
      '<div class="row"><label>Alerts on this device (needs the backend)</label><div id="pushRow"></div></div>' +
      '<div class="row" style="color:var(--muted);font-size:14px">Tornado, severe thunderstorm, flash flood and flood warnings always sound, even when snoozed. Lightning within 10 miles, a wildfire within 10 miles and major river flooding nearby chime once each.</div>') +
    pane('brief', '<div class="row"><div class="btns"><button data-act="brief-now">Play a briefing now</button></div></div>' +
      '<div class="row">' +
      '<div class="toggle"><div><div class="tl">Spoken alerts</div><div class="td">Say what the chime is for: rain arriving, lightning, warnings, fire or flooding nearby</div></div><button class="sw ' + (S.brief.speakAlerts ? 'on' : '') + '" data-brief="speakAlerts"></button></div>' +
      '<div class="toggle"><div><div class="tl">Briefing when the screen wakes</div><div class="td">Once per half hour at most</div></div><button class="sw ' + (S.brief.onWake ? 'on' : '') + '" data-brief="onWake"></button></div>' +
      '</div>' +
      '<div class="row"><label>Scheduled briefing times (24-hour, comma separated, e.g. 06:30, 17:00)</label><input id="briefTimes" type="text" inputmode="numeric" value="' + (S.brief.times || '').replace(/"/g, '') + '" placeholder="06:30, 17:00" ' + inputStyle + '><div class="btns"><button data-act="brief-times">Save times</button></div></div>' +
      '<div class="row"><label>Voice</label><select id="briefVoice" ' + inputStyle + '>' + ['<option value="">Automatic</option>'].concat((speech.voices.length ? speech.voices : (loadVoices(), speech.voices)).map(v => '<option value="' + v.name.replace(/"/g, '') + '"' + (S.brief.voice === v.name ? ' selected' : '') + '>' + v.name + ' (' + v.lang + ')</option>')).join('') + '</select></div>' +
      '<div class="row"><label>Speech rate</label><input type="range" min="0.7" max="1.4" step="0.05" data-slider="rate" value="' + S.brief.rate + '"></div>' +
      '<div class="row" style="color:var(--muted);font-size:14px">Briefings use the device\'s own speech engine and work offline. With a backend configured, the text is written by a language model from the same NWS data; otherwise it is composed on the device. The Sound switch (Alerts tab) silences all speech.</div>') +
    pane('voice', '<div class="row">' +
      '<div class="toggle"><div><div class="tl">Wake word</div><div class="td">Always listen for the wake word while the app is on screen; then say a command</div></div><button class="sw ' + (S.voice.enabled ? 'on' : '') + '" data-voice="enabled"></button></div>' +
      '<div class="toggle"><div><div class="tl">Spoken confirmations</div><div class="td">"Zooming in", "Snoozed for one hour"</div></div><button class="sw ' + (S.voice.confirm ? 'on' : '') + '" data-voice="confirm"></button></div></div>' +
      '<div class="row"><label>Status</label><div id="voiceStatus" style="font-size:15px">' + voice.status + (voice.err ? ' — ' + voice.err : '') + '</div>' +
      '<div class="btns"><button data-act="voice-start">Start listening</button><button data-act="voice-stop">Stop</button><button data-act="voice-test">Try a command (tap to talk)</button></div></div>' +
      '<div class="row"><label>Wake word</label><select id="voiceKw" ' + inputStyle + '>' + WAKE_WORDS.map(w => '<option' + (S.voice.keyword === w ? ' selected' : '') + '>' + w + '</option>').join('') + '</select></div>' +
      '<div class="row"><label>Wake-word sensitivity (higher = easier to trigger, more false alarms)</label><input type="range" min="0.3" max="0.9" step="0.05" data-slider="sensitivity" value="' + S.voice.sensitivity + '"></div>' +
      '<div class="row"><label>Picovoice access key (free for personal use at console.picovoice.ai)</label><input id="voiceKey" type="password" autocomplete="off" value="' + (S.voice.key || '').replace(/"/g, '&quot;') + '" ' + inputStyle + '><div class="btns"><button data-act="voice-key">Save key</button></div></div>' +
      '<div class="row" style="color:var(--muted);font-size:14px">' + COMMANDS_HELP + ' The wake word is detected on the device and works offline; the command itself is recognised by the browser (Chrome uses Google\'s service, so it needs a connection). Listening works while the app is on screen on tablets and phones; the microphone is cut when the screen is off or another app is in front.</div>') +
    pane('layers', '<div class="row" style="margin-top:4px">' + Object.entries(LAYER_INFO).map(([k, [name, desc]]) =>
      '<div class="toggle"><div><div class="tl">' + name + '</div><div class="td">' + desc + '</div></div><button class="sw ' + (S.layers[k] ? 'on' : '') + '" data-layer="' + k + '" role="switch" aria-checked="' + !!S.layers[k] + '" aria-label="' + name + '"></button></div>').join('') + '</div>' +
      '<div class="row" style="color:var(--muted);font-size:14px">Radar, your rings and NWS warnings are always shown. Lightning appears when a backend is set. Wind arrows come from Open-Meteo; satellite clouds and smoke from NOAA.</div>') +
    pane('data', segRows('data') +
      '<div class="row"><label>Backend address (optional — adds lightning, shared radar cache and alerts with the screen off)</label>' +
      '<input id="beUrl" type="url" placeholder="https://radar.yourdomain.com" value="' + (S.backend || '').replace(/"/g, '&quot;') + '" ' + inputStyle + '>' +
      '<div class="btns"><button data-act="besave">Save address</button><button data-act="beclear">Use no backend</button></div><div id="beMsg" style="color:var(--muted);font-size:14px;margin-top:6px"></div></div>') +
    pane('about', '<div class="diag" id="diag" style="border-top:0;margin-top:0;padding-top:4px"></div>' +
      '<div class="row" style="color:var(--muted);font-size:13px">Data: NOAA/NWS (radar, forecasts, alerts, river gauges, smoke, satellite), NIFC (wildfires), Open-Meteo (wind arrows), OpenStreetMap (map). Supplemental information — not a substitute for official warnings or your own judgment.</div>') +
    '<button class="done" data-act="close">Done</button>';
  renderPushRow();
  renderDiag();
  openModal();
}
$('#btnLayers').addEventListener('click', () => openSettings('layers'));
function renderDiag() {
  const d = $('#diag'); if (!d) return;
  const m = st.nc && st.nc.motion;
  d.textContent = [
    'Location: ' + (st.loc ? st.loc.lat.toFixed(4) + ', ' + st.loc.lon.toFixed(4) + ' (' + st.loc.src + ')' : 'none') + (st.gpsAcc ? ' · GPS ±' + Math.round(st.gpsAcc) + ' m' : '') + (st.gpsErr ? ' · GPS: ' + st.gpsErr : ''),
    'Radar: ' + (S.source === 'mrms' ? 'NOAA MRMS filtered' : 'raw NEXRAD (IEM)') + (st.latestRadar ? ', latest scan ' + clock(st.latestRadar) + (st.timesFromServer ? '' : ' (estimated)') : ''),
    'Rain tracking: ' + (st.ncErr ? 'ERROR — ' + st.ncErr : 'OK, ' + ago(st.ncAt)),
    'Storm trends: ' + (st.nc && st.nc.trends ? (st.nc.trends.filter(t => t.word === 'strengthening').length + ' strengthening, ' + st.nc.trends.filter(t => t.word === 'weakening').length + ' weakening, ' + st.nc.trends.filter(t => t.word === 'steady').length + ' steady, ' + st.nc.trends.filter(t => t.word === 'new').length + ' new') : '—') + (st.nc && st.nc.res.hit && st.nc.res.hit.trend ? ' · arriving storm: ' + st.nc.res.hit.trend.word + (st.nc.res.hit.fizzles ? ' (likely to fizzle first)' : '') : ''),
    'Storm motion: ' + (m ? (m.ok ? compass(m.headingDeg) + ' ' + Math.round(m.speedMph) + ' mph (confidence ' + m.global.conf.toFixed(2) + ', ' + m.regions.filter(r => r.ok).length + '/9 areas)' : 'unclear — ' + (m.reason || '')) : '—'),
    'NWS weather: ' + (st.wx.err ? 'ERROR — ' + st.wx.err : ago(st.wx.obsAt)) + (st.wx.stationId ? ' · station ' + st.wx.stationId : '') + (st.wx.pop2h != null ? ' · rain chance next 2 h ' + st.wx.pop2h + '%' : ''),
    'NWS alerts: ' + (st.alertsErr ? 'ERROR — ' + st.alertsErr : ago(st.alertsAt) + ', ' + st.alerts.length + ' active'),
    'Backend: ' + (BE() ? BE() + (st.backendOk === false ? ' — unreachable' : st.backendOk ? ' — OK' : '') : 'none (standalone)'),
    'Lightning: ' + (!BE() ? 'needs backend' : st.lightningErr ? 'ERROR — ' + st.lightningErr : st.lightning ? (st.lightning.within30 + ' strikes within 30 mi · ' + ago(st.lightningAt) + (st.lightning.dataFresh ? '' : ' · feed stale')) : '—'),
    'Alerts on this device: ' + (S.pushId ? 'on' : 'off'),
    'Voice: ' + voice.status + (voice.err ? ' — ' + voice.err : ''),
    'Map layers: ' + Object.entries(S.layers).filter(([k, v]) => v).map(([k]) => LAYER_INFO[k][0]).join(', ') + (st.hz.err ? ' · ERROR — ' + st.hz.err : st.hz.at ? ' · hazards ' + ago(st.hz.at) : '') + (st.windNote ? ' · ' + st.windNote : ''),
    'Sound: ' + (!S.sound ? 'off (Settings)' : audio() ? audio().state : 'unavailable'),
  ].join('\n');
}
function closeModal() { $('#modal').hidden = true; if (speech.speaking && $('#briefText')) stopSpeaking(); if (history.state && history.state.sheet) history.back(); }
$('#sheetClose').addEventListener('click', closeModal);
// Back button / swipe-back closes the panel instead of leaving the app
window.addEventListener('popstate', () => { if (!$('#modal').hidden) $('#modal').hidden = true; });
function openModal() { if (!(history.state && history.state.sheet)) history.pushState({ sheet: true }, ''); $('#modal').hidden = false; }
$('#btnSettings').addEventListener('click', openSettings);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'close') return closeModal();
  if (b.dataset.act === 'rain') return playChime('rain');
  if (b.dataset.act === 'warn') return playWarning();
  if (b.dataset.tab) { settingsTab = b.dataset.tab; $('#sheet').querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); $('#sheet').querySelectorAll('.tabpane').forEach(p => p.hidden = p.dataset.pane !== settingsTab); return; }
  if (b.dataset.speak) { if (speech.speaking) stopSpeaking(); else if (st.lastBrief) speak(st.lastBrief); return; }
  if (b.dataset.act === 'brief-now') { closeModal(); openBriefing(true); return; }
  if (b.dataset.act === 'brief-refresh') { openBriefing(true); return; }
  if (b.dataset.act === 'brief-settings') { openSettings('brief'); return; }
  if (b.dataset.act === 'brief-times') { S.brief.times = ($('#briefTimes').value.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/g) || []).map(t => t.padStart(5, '0')).join(', '); $('#briefTimes').value = S.brief.times; save(); return; }
  if (b.dataset.brief) { S.brief[b.dataset.brief] = !S.brief[b.dataset.brief]; save(); b.classList.toggle('on', S.brief[b.dataset.brief]); return; }
  if (b.dataset.voice) { S.voice[b.dataset.voice] = !S.voice[b.dataset.voice]; save(); b.classList.toggle('on', S.voice[b.dataset.voice]); if (b.dataset.voice === 'enabled') { if (S.voice.enabled) startWakeWord(); else stopWakeWord(); } return; }
  if (b.dataset.act === 'voice-start') { S.voice.enabled = true; save(); startWakeWord(); return; }
  if (b.dataset.act === 'voice-stop') { S.voice.enabled = false; save(); stopWakeWord(); return; }
  if (b.dataset.act === 'voice-test') { closeModal(); listenForCommand(); return; }
  if (b.dataset.act === 'voice-key') { S.voice.key = $('#voiceKey').value.trim(); save(); setVoiceStatus(S.voice.key ? 'key saved' : 'needs an access key'); if (S.voice.enabled) { stopWakeWord().then(startWakeWord); } return; }
  if (b.dataset.layer) { S.layers[b.dataset.layer] = !S.layers[b.dataset.layer]; save(); b.classList.toggle('on', S.layers[b.dataset.layer]); b.setAttribute('aria-checked', String(!!S.layers[b.dataset.layer])); applyLayers(); return; }
  if (b.dataset.act === 'loc') return openLocation();
  if (b.dataset.act === 'besave' || b.dataset.act === 'beclear') {
    S.backend = b.dataset.act === 'beclear' ? '' : $('#beUrl').value.trim(); save();
    $('#beMsg').textContent = S.backend ? 'Checking…' : 'Running standalone (no lightning or push).';
    if (S.backend) fetchT(BE() + '/health', {}, 10000).then(r => r.json()).then(j => { $('#beMsg').textContent = 'Connected · radar scans: ' + j.radar.scans + ' · lightning flashes in the last hour: ' + j.lightning.flashes + (j.push.enabled ? '' : ' · push keys not set on the backend yet'); st.backendOk = true; })
      .catch(() => { $('#beMsg').textContent = 'Could not reach that address (check https and CORS).'; st.backendOk = false; });
    refreshRadarTiles(true).then(runNowcast); refreshLightning(); renderPushRow();
    return;
  }
  if (b.dataset.push) return pushAction(b.dataset.push, b);
  if (b.dataset.loc === 'gps') { useGps(); closeModal(); return; }
  if (b.dataset.loc === 'tap') { closeModal(); setPicking(true); return; }
  const k = b.dataset.k; if (!k) return;
  const cur = S[k], raw = b.dataset.v;
  const v = typeof cur === 'boolean' ? raw === 'true' : typeof cur === 'number' ? +raw : raw;
  S[k] = v; save();
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  if (k === 'night') applyNight();
  if (k === 'animate') setAnim(v);
  if (k === 'sound') updateSoundChip();
  if (k === 'hitMi' || k === 'threshDbz') runNowcast();
  if (k === 'source') refreshRadarTiles(true).then(runNowcast);
});
$('#sheet').addEventListener('change', e => { if (e.target.id === 'briefVoice') { S.brief.voice = e.target.value; save(); speak('This is the voice for your briefings.'); } if (e.target.id === 'voiceKw') { S.voice.keyword = e.target.value; save(); if (voice.running) stopWakeWord().then(startWakeWord); } });
$('#sheet').addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.slider; if (!k) return;
  if (k === 'rate') { S.brief.rate = +e.target.value; save(); return; }
  if (k === 'sensitivity') { S.voice.sensitivity = +e.target.value; save(); return; }
  S[k] = +e.target.value; save();
  if (k === 'opacity') showFrame(frameIdx);
});

/* ------------------------------ wake lock -------------------------- */
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); runNowcast(); refreshAlerts(); } });

/* -------------------------------- start ---------------------------- */
$('#soundChip').addEventListener('click', () => { const a = audio(); if (a) a.resume().then(updateSoundChip); });
setAnim(S.animate);
refreshRadarTiles(true);
applyNight();
fitRange();
if (S.locMode === 'manual' && S.manual) setLocation(S.manual.lat, S.manual.lon, 'manual');
else if (S.lastLoc) setLocation(S.lastLoc.lat, S.lastLoc.lon, S.lastLoc.src);
startGps();
updatePickHint();
renderStatus();
keepAwake();
setTimeout(updateSoundChip, 800);

setInterval(() => { refreshRadarTiles().then(runNowcast); }, 5 * 60000);
setInterval(refreshAlerts, 2 * 60000);
setInterval(refreshLightning, 60000);
setInterval(() => { refreshHazards(); refreshWind(); if (S.layers.smoke) smokeLayer.redraw(); if (S.layers.clouds) { if (cloudLayer && cloudLayer._night === cloudIsNight()) cloudLayer.redraw(); else applyLayers(); } }, 10 * 60000);
setTimeout(applyLayers, 1500);
map.on('moveend', () => { if (BE()) refreshLightning(); });
setTimeout(refreshLightning, 4000);
if (S.pushId && pushSupported()) swReg().catch(() => {});
setInterval(() => { if (st.wx.points) refreshObs().catch(() => {}); }, 15 * 60000);
setInterval(() => { if (st.wx.points) refreshForecast().then(applyNight).catch(() => {}); }, 30 * 60000);
setInterval(() => {
  renderStatus(); applyNight(); renderDiag();
  if (st.lastTouch && Date.now() - st.lastTouch > 120000) { st.lastTouch = 0; fitRange(); }   // drift back after 2 min
}, 30000);
</script>
</body>
</html>
